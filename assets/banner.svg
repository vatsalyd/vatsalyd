<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .prompt { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 14px; fill: #64748b; font-weight: 500; }
    .user { fill: #2dd4bf; font-weight: 700; }
    .cmd { fill: #f8fafc; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: 1px; fill: #f8fafc; }
    .title { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #94a3b8; font-weight: 500; }
    .meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #64748b; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #2dd4bf; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="998" height="178" rx="8" fill="#0b0f17" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Header Bar -->
  <rect x="1" y="1" width="998" height="32" rx="8" fill="#111827" />
  <rect x="1" y="24" width="998" height="8" fill="#111827" />
  <circle cx="20" cy="16" r="4" fill="#334155" />
  <circle cx="34" cy="16" r="4" fill="#334155" />
  <circle cx="48" cy="16" r="4" fill="#334155" />
  <text x="500" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">vatsalyd@iit-bhilai: ~</text>

  <!-- Terminal Content -->
  <g transform="translate(32, 64)">
    <text x="0" y="0" class="prompt">
      <tspan class="user">vatsalyd</tspan><tspan class="cmd"> $ init --profile</tspan>
    </text>

    <text x="0" y="36" class="name">VATSAL YADAV</text>
    <text x="0" y="62" class="title">Systems &amp; AI Engineer · Multi-Agent Orchestration · IIT Bhilai</text>

    <!-- Status pill -->
    <g transform="translate(0, 80)">
      
    </g>
  </g>
</svg>
