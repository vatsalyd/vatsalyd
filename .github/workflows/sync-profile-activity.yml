name: Update GitHub Profile Activity & Visuals

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and update GitHub activity & generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import os
          import re

          username = "vatsalyd"
          token = os.environ.get("GITHUB_TOKEN", "")
          
          headers = {
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "GitHub-Action-Activity-Updater"
          }
          if token:
              headers["Authorization"] = f"token {token}"

          # 1. Fetch outside PRs via search API
          query = f"author:{username}+-user:{username}+type:pr"
          url = f"https://api.github.com/search/issues?q={query}&sort=created&order=desc&per_page=6"
          
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  items = data.get("items", [])
          except Exception as e:
              print(f"Error fetching PRs: {e}")
              items = []

          # Build Markdown table (no emojis)
          rows = [
              "| Repository | Contribution / Pull Request | Status |",
              "|:---|:---|:---:|"
          ]

          for item in items:
              repo_url = item.get("repository_url", "")
              repo_name = "/".join(repo_url.split("/")[-2:]) if repo_url else "external-repo"
              title = item.get("title", "").replace("|", "\\|")
              html_url = item.get("html_url", "")
              state = item.get("state", "closed")
              
              pr_data = item.get("pull_request", {})
              is_merged = pr_data.get("merged_at") is not None or state == "merged"
              
              if is_merged:
                  status_badge = "`merged`"
              elif state == "open":
                  status_badge = "`open`"
              else:
                  status_badge = "`closed`"

              rows.append(f"| [`{repo_name}`](https://github.com/{repo_name}) | [{title}]({html_url}) | {status_badge} |")

          if len(rows) == 2:
              activity_md = "_No recent external pull requests found._"
          else:
              activity_md = "\n".join(rows)

          # 2. Update README.md between tags
          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  content = f.read()

              pattern = r"<!-- START_SECTION:activity -->[\s\S]*?<!-- END_SECTION:activity -->"
              replacement = f"<!-- START_SECTION:activity -->\n{activity_md}\n<!-- END_SECTION:activity -->"
              
              new_content = re.sub(pattern, replacement, content)
              
              with open(readme_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README updated successfully with live activity.")
          EOF

      - name: Generate Contribution Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: vatsalyd
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-sync): update live activity and contribution graph [skip ci]" && git push)
